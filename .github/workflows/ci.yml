name: Record Linkage CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q agents record_linkage cli.py linkage_dedup.py simulator.py enrichment.py
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: python linkage_dedup.py data/dataset_a.csv data/dataset_b.csv --output /tmp/linkage_report.csv
      - name: Browser engine tests
        run: node --test web/*.test.mjs
