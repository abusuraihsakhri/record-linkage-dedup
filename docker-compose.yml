services:
  record-linkage-dedup:
    build: .
    container_name: record-linkage-dedup
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-}
      - MODEL_PROVIDER=mock
      - API_TOKEN=${API_TOKEN:?Set a random API_TOKEN in your environment before starting Docker Compose}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
